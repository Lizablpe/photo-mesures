<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo EINS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photo EINS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f3ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #f5f3ef;
    --surface: #ffffff;
    --text: #1f2a44;
    --muted: #5d6578;
    --line: #dcd6cc;
    --primary: #1f2a44;
    --on-primary: #ffffff;
    --tag: #c8a97e;
    --on-tag: #1f2a44;
    --ok: #1d7a4c;
    --on-ok: #ffffff;
    --err: #b42318;
    --wait: #8a6a3b;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #121826;
      --surface: #1c2436;
      --text: #eef0f4;
      --muted: #a3abbb;
      --line: #2e3850;
      --primary: #c8a97e;
      --on-primary: #121826;
      --tag: #c8a97e;
      --on-tag: #121826;
      --ok: #4cc38a;
      --on-ok: #121826;
      --err: #ff8a80;
      --wait: #d9b98a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--page); color: var(--text); }
  body {
    font-family: 'Archivo', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-size: 17px; line-height: 1.4;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--page);
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .titre { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .droite { display: flex; align-items: center; gap: 12px; }
  .compteur { font-size: 15px; color: var(--muted); white-space: nowrap; }
  .reglagesBtn {
    font: inherit; font-size: 20px; line-height: 1; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text);
  }
  .source {
    display: grid; grid-template-columns: 1fr 1fr; margin-top: 10px;
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  }
  .source button {
    font: inherit; font-size: 15px; padding: 8px; border: 0;
    background: var(--surface); color: var(--muted);
  }
  .source button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); font-weight: 600; }
  .chantier {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 8px; font-size: 14px; color: var(--muted);
  }
  .chantier button {
    font: inherit; font-size: 14px; font-weight: 600; padding: 4px 0;
    border: 0; background: transparent; color: var(--text); text-decoration: underline;
  }
  .horsReseau { color: var(--wait); font-weight: 600; }

  main { padding: 8px 16px 0; max-width: 560px; margin: 0 auto; }
  h2 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 18px 0 8px; }
  .grille { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .type {
    font: inherit; text-align: left;
    display: flex; align-items: center; gap: 10px;
    min-height: 64px; padding: 10px 12px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px;
  }
  .type:active { transform: scale(0.98); }
  .type .code {
    flex: none; min-width: 40px; padding: 4px 6px; border-radius: 6px;
    background: var(--tag); color: var(--on-tag);
    font-weight: 700; font-size: 15px; text-align: center;
  }
  .type .libelle { font-weight: 500; font-size: 16px; }
  .type.large { grid-column: span 2; }
  .type.fait { border-color: var(--ok); }
  .badge {
    display: none; margin-left: auto; flex: none;
    min-width: 34px; padding: 3px 8px; border-radius: 999px;
    font-size: 14px; font-weight: 700; text-align: center;
  }
  .badge.ok { display: inline-block; background: var(--ok); color: var(--on-ok); }
  .badge.wait { display: inline-block; border: 1px solid var(--wait); color: var(--wait); }

  .attente {
    margin: 16px 0 0; padding: 10px 12px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--wait); color: var(--wait);
    font-size: 15px; display: none;
  }
  .attente.visible { display: block; }
  ul.envois { list-style: none; padding: 0; margin: 8px 0 0; }
  ul.envois li {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  ul.envois img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; flex: none; background: var(--line); }
  .nom { flex: 1; min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
  .nom small { display: block; color: var(--err); font-size: 13px; }
  .statut { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .statut.ok { color: var(--ok); }
  .statut.err { color: var(--err); }
  .statut.wait { color: var(--wait); }
  .reessayer {
    font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--err); background: transparent; color: var(--err);
  }
  .vide { color: var(--muted); font-size: 15px; margin: 8px 0 0; }

  .voile {
    position: fixed; inset: 0; z-index: 10; background: rgba(10, 14, 24, 0.45);
    display: none; align-items: flex-end;
  }
  .voile.ouvert { display: flex; }
  .feuille {
    width: 100%; background: var(--surface); color: var(--text);
    border-radius: 16px 16px 0 0;
    padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
  }
  .feuille h3 { margin: 0 0 4px; font-size: 19px; }
  .feuille p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
  .feuille input {
    width: 100%; font: inherit; font-size: 17px; padding: 12px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--page); color: var(--text);
  }
  .feuille .message { margin: 10px 0 0; font-size: 15px; min-height: 1.4em; }
  .feuille .message.ok { color: var(--ok); }
  .feuille .message.err { color: var(--err); }
  .actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 14px; }
  .actions button { font: inherit; font-weight: 600; padding: 14px; border-radius: 12px; border: 1px solid var(--line); }
  .annuler { background: transparent; color: var(--text); }
  .valider { background: var(--primary); color: var(--on-primary); border-color: var(--primary) !important; }

  button:focus-visible, input:focus-visible { outline: 3px solid var(--tag); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .type:active { transform: none; } }
  .cache { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<header>
  <div class="titre">
    <h1>Photo EINS</h1>
    <div class="droite">
      <span class="compteur" id="compteur">0 photo envoyée</span>
      <button type="button" class="reglagesBtn" id="ouvrirReglages" aria-label="Réglages">⚙︎</button>
    </div>
  </div>
  <div class="source" role="group" aria-label="Source de la photo">
    <button type="button" id="srcCamera" aria-pressed="true">Appareil photo</button>
    <button type="button" id="srcGalerie" aria-pressed="false">Galerie</button>
  </div>
  <div class="chantier">
    <span><span id="depuis">Photos du jour</span> <span id="reseau" class="horsReseau"></span></span>
    <button type="button" id="nouveauChantier">Nouveau chantier</button>
  </div>
</header>

<main>
  <div id="types"></div>

  <div class="attente" id="attente"></div>
  <h2>Envois</h2>
  <p class="vide" id="vide">Touche un type ci-dessus pour prendre la première photo.</p>
  <ul class="envois" id="envois"></ul>
</main>

<!-- Marque et modèle / description -->
<div class="voile" id="voile">
  <div class="feuille" role="dialog" aria-modal="true" aria-labelledby="feuilleTitre">
    <h3 id="feuilleTitre"></h3>
    <p id="feuilleAide"></p>
    <input id="feuilleChamp" type="text" autocomplete="off" autocapitalize="words" enterkeyhint="go">
    <div class="actions">
      <button type="button" class="annuler" id="feuilleAnnuler">Annuler</button>
      <button type="button" class="valider" id="feuilleValider">Prendre la photo</button>
    </div>
  </div>
</div>

<!-- Réglages : lien du script Google -->
<div class="voile" id="voileReglages">
  <div class="feuille" role="dialog" aria-modal="true" aria-labelledby="reglagesTitre">
    <h3 id="reglagesTitre">Réglages</h3>
    <p>Colle le lien du script Google, celui qui se termine par <b>/exec?k=…</b></p>
    <input id="champLien" type="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec?k=…">
    <p class="message" id="reglagesMessage"></p>
    <div class="actions">
      <button type="button" class="annuler" id="reglagesFermer">Fermer</button>
      <button type="button" class="valider" id="reglagesEnregistrer">Enregistrer et tester</button>
    </div>
  </div>
</div>

<input class="cache" type="file" id="inCamera" accept="image/*" capture="environment">
<input class="cache" type="file" id="inGalerie" accept="image/*">

<script>
  /* ---------- Types de photos (mêmes noms que la skill EINS) ---------- */
  // demande : 'modele' (marque et modèle, facultatif) ou 'desc' (description obligatoire)
  const TYPES = [
    { section: 'Points de mesure', items: [
      { id: 'voisin', code: 'V', libelle: 'Voisin' },
      { id: 'P2-limiteur', code: 'P2', libelle: 'Limiteur' },
      { id: 'P1-defavorable', code: 'P1', libelle: 'Défavorable 1' },
      { id: 'P1-defavorable-2', code: 'P1', libelle: 'Défavorable 2' },
      { id: 'P1-defavorable-3', code: 'P1', libelle: 'Défavorable 3' },
      { id: 'P1-defavorable-4', code: 'P1', libelle: 'Défavorable 4' },
      { id: 'micro-limiteur', code: 'M', libelle: 'Micro du limiteur' }
    ]},
    { section: 'Sources', items: [
      { id: 'enceinte-1', code: 'E1', libelle: 'Enceinte 1', demande: 'modele' },
      { id: 'enceinte-2', code: 'E2', libelle: 'Enceinte 2', demande: 'modele' },
      { id: 'enceinte-3', code: 'E3', libelle: 'Enceinte 3', demande: 'modele' },
      { id: 'enceinte-4', code: 'E4', libelle: 'Enceinte 4', demande: 'modele' },
      { id: 'caisson-1', code: 'C1', libelle: 'Caisson 1', demande: 'modele' },
      { id: 'caisson-2', code: 'C2', libelle: 'Caisson 2', demande: 'modele' }
    ]},
    { section: 'Régie', items: [
      { id: 'table-mixage', code: 'TM', libelle: 'Table de mixage', demande: 'modele' },
      { id: 'ampli-1', code: 'A1', libelle: 'Ampli 1', demande: 'modele' },
      { id: 'ampli-2', code: 'A2', libelle: 'Ampli 2', demande: 'modele' }
    ]},
    { section: 'Divers', items: [
      { id: 'facade', code: 'F', libelle: 'Façade' },
      { id: 'autre', code: '…', libelle: 'Autre', demande: 'desc' }
    ]}
  ];

  const $ = (id) => document.getElementById(id);
  const IDS = TYPES.flatMap((g) => g.items.map((t) => t.id)).sort((a, b) => b.length - a.length);
  const BADGES = {};

  const etat = {
    source: 'camera',
    enCours: null,
    modeles: {},
    nomsUtilises: new Set(),
    photos: [],        // {nom, jour, statut, b64, vignette, cree, erreur}
    drive: [],         // noms présents dans le Drive aujourd'hui
    debut: '',
    config: null,      // {url, cle}
    pompeActive: false
  };

  /* ---------- Petits outils ---------- */
  function deux(n) { return String(n).padStart(2, '0'); }
  function jour(d) { d = d || new Date(); return d.getFullYear() + '-' + deux(d.getMonth() + 1) + '-' + deux(d.getDate()); }
  function horodater(d) { return jour(d) + '_' + deux(d.getHours()) + deux(d.getMinutes()); }
  function sansExt(n) { return String(n).replace(/\.jpe?g$/i, ''); }
  function lire(cle, defaut) {
    try { const v = localStorage.getItem(cle); return v === null ? defaut : JSON.parse(v); } catch (e) { return defaut; }
  }
  function ecrire(cle, valeur) {
    try { localStorage.setItem(cle, JSON.stringify(valeur)); } catch (e) {}
  }

  /* ---------- Base locale (les photos restent sur le téléphone jusqu'à leur arrivée) ---------- */
  const Base = (() => {
    let base = null;
    function ouvrir() {
      if (base) return base;
      base = new Promise((ok, ko) => {
        try {
          const r = indexedDB.open('photo-eins', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'nom' });
          r.onsuccess = () => ok(r.result);
          r.onerror = () => ko(r.error);
        } catch (e) { ko(e); }
      });
      return base;
    }
    function op(mode, fn) {
      return ouvrir().then((db) => new Promise((ok, ko) => {
        const t = db.transaction('photos', mode);
        const req = fn(t.objectStore('photos'));
        t.oncomplete = () => ok(req && req.result);
        t.onerror = () => ko(t.error);
      }));
    }
    return {
      mettre: (p) => op('readwrite', (st) => st.put({
        nom: p.nom, jour: p.jour, statut: p.statut, b64: p.b64,
        vignette: p.vignette, cree: p.cree, erreur: p.erreur
      })).catch(() => {}),
      retirer: (nom) => op('readwrite', (st) => st.delete(nom)).catch(() => {}),
      tout: () => op('readonly', (st) => st.getAll()).then((r) => r || []).catch(() => [])
    };
  })();

  /* ---------- Réglages ---------- */
  function analyserLien(texte) {
    try {
      const u = new URL(String(texte).trim());
      const cle = u.searchParams.get('k');
      if (!/script\.google\.com$/.test(u.hostname) || !/\/exec$/.test(u.pathname) || !cle) return null;
      return { url: u.origin + u.pathname, cle: cle };
    } catch (e) { return null; }
  }

  function ouvrirReglages() {
    $('champLien').value = etat.config ? etat.config.url + '?k=' + etat.config.cle : '';
    $('reglagesMessage').textContent = '';
    $('reglagesMessage').className = 'message';
    $('voileReglages').classList.add('ouvert');
  }
  $('ouvrirReglages').addEventListener('click', ouvrirReglages);
  $('reglagesFermer').addEventListener('click', () => $('voileReglages').classList.remove('ouvert'));
  $('reglagesEnregistrer').addEventListener('click', async () => {
    const msg = $('reglagesMessage');
    const cfg = analyserLien($('champLien').value);
    if (!cfg) {
      msg.className = 'message err';
      msg.textContent = 'Lien incomplet : il doit se terminer par /exec?k= suivi de la clé.';
      return;
    }
    etat.config = cfg;
    ecrire('photoEins.config', cfg);
    msg.className = 'message';
    msg.textContent = 'Test de la connexion…';
    const r = await chargerDrive();
    if (r === true) {
      msg.className = 'message ok';
      msg.textContent = 'Connexion OK : ' + etat.drive.length + ' photo(s) aujourd\'hui dans le Drive.';
      pompe();
    } else {
      msg.className = 'message err';
      msg.textContent = 'Lien enregistré, mais le test a échoué' + (typeof r === 'string' ? ' (' + r + ')' : '') +
        '. Vérifie le réseau et le lien.';
    }
  });

  /* ---------- Boutons de types ---------- */
  (function construire() {
    const racine = $('types');
    TYPES.forEach((groupe) => {
      const h = document.createElement('h2');
      h.textContent = groupe.section;
      racine.appendChild(h);
      const grille = document.createElement('div');
      grille.className = 'grille';
      groupe.items.forEach((t, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'type';
        if (groupe.items.length % 2 === 1 && i === groupe.items.length - 1) b.classList.add('large');
        b.innerHTML = '<span class="code"></span><span class="libelle"></span><span class="badge"></span>';
        b.querySelector('.code').textContent = t.code;
        b.querySelector('.libelle').textContent = t.libelle;
        BADGES[t.id] = { bouton: b, pastille: b.querySelector('.badge') };
        b.addEventListener('click', () => choisir(t));
        grille.appendChild(b);
      });
      racine.appendChild(grille);
    });
  })();

  function majSource(s) {
    etat.source = s;
    $('srcCamera').setAttribute('aria-pressed', s === 'camera');
    $('srcGalerie').setAttribute('aria-pressed', s === 'galerie');
  }
  $('srcCamera').addEventListener('click', () => majSource('camera'));
  $('srcGalerie').addEventListener('click', () => majSource('galerie'));

  function choisir(t) {
    if (!etat.config) { ouvrirReglages(); return; }
    if (!t.demande) {
      etat.enCours = { type: t, texte: '' };
      ouvrirAppareil();
      return;
    }
    $('feuilleTitre').textContent = t.libelle;
    $('feuilleAide').textContent = t.demande === 'modele'
      ? 'Marque et modèle (ex. Syrincs D8 Column). Laisse vide si tu ne sais pas.'
      : 'Décris en 2 ou 3 mots';
    const champ = $('feuilleChamp');
    champ.value = t.demande === 'modele' ? (etat.modeles[t.id] || '') : '';
    etat.enCours = { type: t, texte: '' };
    $('voile').classList.add('ouvert');
    setTimeout(() => champ.focus(), 50);
  }

  $('feuilleAnnuler').addEventListener('click', () => { etat.enCours = null; $('voile').classList.remove('ouvert'); });
  $('feuilleValider').addEventListener('click', validerFeuille);
  $('feuilleChamp').addEventListener('keydown', (e) => { if (e.key === 'Enter') validerFeuille(); });

  function validerFeuille() {
    const texte = $('feuilleChamp').value.trim();
    const t = etat.enCours && etat.enCours.type;
    if (!t) return;
    if (t.demande === 'desc' && !texte) { $('feuilleChamp').focus(); return; }
    if (t.demande === 'modele' && texte) { etat.modeles[t.id] = texte; ecrire('photoEins.modeles', etat.modeles); }
    etat.enCours.texte = texte;
    $('voile').classList.remove('ouvert');
    ouvrirAppareil();   // doit rester dans le geste de l'utilisateur sur iPhone
  }

  function ouvrirAppareil() {
    const input = etat.source === 'camera' ? $('inCamera') : $('inGalerie');
    input.value = '';
    input.click();
  }
  $('inCamera').addEventListener('change', recevoir);
  $('inGalerie').addEventListener('change', recevoir);

  /* ---------- Nom du fichier ---------- */
  function construireNom(choix, date) {
    const t = choix.type;
    let partie;
    if (t.demande === 'desc') partie = 'autre-' + choix.texte;
    else if (t.demande === 'modele' && choix.texte) partie = t.id + '_' + choix.texte;
    else partie = t.id;
    partie = partie.replace(/[\\/:*?"<>|]/g, '-').replace(/\s+/g, ' ').trim();

    const base = horodater(date) + '_' + partie;
    let essai = base, i = 2;
    while (etat.nomsUtilises.has(essai)) essai = base + '_' + i++;
    etat.nomsUtilises.add(essai);
    return essai + '.jpg';
  }

  /* ---------- Prise de vue ---------- */
  async function recevoir(e) {
    const fichier = e.target.files && e.target.files[0];
    const choix = etat.enCours;
    etat.enCours = null;
    if (!fichier || !choix) return;

    const photo = {
      nom: construireNom(choix, new Date()), jour: jour(), statut: 'prep',
      b64: null, vignette: '', cree: Date.now(), erreur: ''
    };
    etat.photos.unshift(photo);
    afficher();

    try {
      const r = await preparer(fichier);
      photo.b64 = r.b64;
      photo.vignette = r.vignette;
      photo.statut = 'attente';
      await Base.mettre(photo);          // gardée sur le téléphone avant tout envoi
    } catch (err) {
      photo.statut = 'echec';
      photo.erreur = 'photo illisible, reprends-la';
    }
    afficher();
    pompe();
  }

  function preparer(fichier) {
    return new Promise((ok, ko) => {
      const url = URL.createObjectURL(fichier);
      const img = new Image();
      img.onload = () => {
        const dessiner = (max, qualite) => {
          const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
          const c = document.createElement('canvas');
          c.width = Math.round(img.naturalWidth * r);
          c.height = Math.round(img.naturalHeight * r);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          return c.toDataURL('image/jpeg', qualite);
        };
        const b64 = dessiner(2560, 0.85).split(',')[1];
        const vignette = dessiner(160, 0.6);
        URL.revokeObjectURL(url);
        ok({ b64: b64, vignette: vignette });
      };
      img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('illisible')); };
      img.src = url;
    });
  }

  /* ---------- Envoi vers le Drive, une photo après l'autre ---------- */
  async function envoyerUne(photo) {
    const ctrl = new AbortController();
    const minuterie = setTimeout(() => ctrl.abort(), 90000);
    try {
      const r = await fetch(etat.config.url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ k: etat.config.cle, name: photo.nom, data: photo.b64 }),
        signal: ctrl.signal,
        redirect: 'follow'
      });
      const texte = (await r.text()).trim();
      if (texte.indexOf('OK') === 0) return true;
      photo.erreur = texte.slice(0, 80) || ('réponse ' + r.status);
      return false;
    } catch (err) {
      photo.erreur = navigator.onLine === false ? 'hors réseau' : 'pas de réponse';
      return false;
    } finally {
      clearTimeout(minuterie);
    }
  }

  async function pompe() {
    if (etat.pompeActive || !etat.config) return;
    if (navigator.onLine === false) { afficher(); return; }
    etat.pompeActive = true;
    try {
      const file = etat.photos
        .filter((p) => p.b64 && p.statut !== 'ok' && p.statut !== 'prep')
        .sort((a, b) => a.cree - b.cree);
      for (const p of file) {
        p.statut = 'envoi';
        p.erreur = '';
        afficher();
        if (await envoyerUne(p)) {
          p.statut = 'ok';
          p.b64 = null;                  // la photo est dans le Drive : on libère le téléphone
          await Base.mettre(p);
          afficher();
        } else {
          p.statut = 'echec';
          await Base.mettre(p);
          afficher();
          break;                         // réseau en difficulté : on réessaiera plus tard
        }
      }
    } finally {
      etat.pompeActive = false;
    }
  }

  async function chargerDrive() {
    if (!etat.config) return false;
    try {
      const u = etat.config.url + '?action=lister&k=' + encodeURIComponent(etat.config.cle) +
        '&prefixe=' + encodeURIComponent(jour());
      const r = await fetch(u, { redirect: 'follow' });
      const j = await r.json();
      if (Array.isArray(j)) {
        etat.drive = j;
        j.forEach((n) => etat.nomsUtilises.add(sansExt(n)));
        afficher();
        return true;
      }
      return (j && j.erreur) || false;
    } catch (e) {
      return false;
    }
  }

  window.addEventListener('online', () => { pompe(); chargerDrive(); afficher(); });
  window.addEventListener('offline', afficher);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { pompe(); chargerDrive(); }
  });
  setInterval(pompe, 30000);

  /* ---------- Compteurs ---------- */
  function typeDeNom(nom) {
    const m = String(nom).match(/^\d{4}-\d{2}-\d{2}_\d{4}_(.+?)(\.jpe?g)?$/i);
    if (!m) return null;
    const reste = m[1];
    if (reste.indexOf('autre-') === 0) return 'autre';
    for (const id of IDS) {
      if (reste === id || reste.indexOf(id + '_') === 0 || reste.indexOf(id + ' ') === 0) return id;
    }
    return null;
  }

  $('nouveauChantier').addEventListener('click', () => {
    etat.debut = horodater(new Date());
    ecrire('photoEins.debut', etat.debut);
    afficher();
  });

  function majCompteurs() {
    const aujourdhui = jour();
    if (!etat.debut || etat.debut < aujourdhui + '_0000') etat.debut = aujourdhui + '_0000';

    const statuts = new Map();
    etat.drive.forEach((n) => statuts.set(n, 'ok'));
    etat.photos.forEach((p) => statuts.set(p.nom, p.statut));

    const compte = {};
    statuts.forEach((st, nom) => {
      if (nom.indexOf(aujourdhui) !== 0 || nom < etat.debut) return;
      const id = typeDeNom(nom);
      if (!id) return;
      const c = compte[id] || (compte[id] = { total: 0, attente: 0 });
      c.total++;
      if (st !== 'ok') c.attente++;
    });

    Object.keys(BADGES).forEach((id) => {
      const { bouton, pastille } = BADGES[id];
      const c = compte[id];
      pastille.className = 'badge';
      pastille.textContent = '';
      bouton.classList.remove('fait');
      if (!c) return;
      if (c.attente) {
        pastille.classList.add('wait');
        pastille.textContent = String(c.total);
      } else {
        pastille.classList.add('ok');
        pastille.textContent = '✓ ' + c.total;
        bouton.classList.add('fait');
      }
    });

    const hhmm = etat.debut.slice(11);
    $('depuis').textContent = hhmm === '0000' ? 'Photos du jour' : 'Photos depuis ' + hhmm.slice(0, 2) + 'h' + hhmm.slice(2);
    $('reseau').textContent = navigator.onLine === false ? '(hors réseau)' : '';
  }

  /* ---------- Affichage ---------- */
  function afficher() {
    majCompteurs();
    const aujourdhui = jour();
    const visibles = etat.photos
      .filter((p) => p.jour === aujourdhui || p.statut !== 'ok')
      .sort((a, b) => b.cree - a.cree);

    const liste = $('envois');
    liste.innerHTML = '';
    visibles.forEach((p) => {
      const li = document.createElement('li');
      const img = document.createElement('img');
      img.alt = '';
      if (p.vignette) img.src = p.vignette;
      const nom = document.createElement('span');
      nom.className = 'nom';
      nom.textContent = p.nom;
      if (p.statut === 'echec' && p.erreur) {
        const s = document.createElement('small');
        s.textContent = p.erreur;
        nom.appendChild(s);
      }
      li.append(img, nom);

      if (p.statut === 'echec' && p.b64) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'reessayer';
        b.textContent = 'Renvoyer';
        b.addEventListener('click', pompe);
        li.appendChild(b);
      } else {
        const s = document.createElement('span');
        s.className = 'statut ' + (p.statut === 'ok' ? 'ok' : p.statut === 'echec' ? 'err' : 'wait');
        s.textContent = p.statut === 'ok' ? 'Envoyée'
          : p.statut === 'echec' ? 'Échec'
          : p.statut === 'envoi' ? 'Envoi…'
          : p.statut === 'prep' ? 'Préparation' : 'En attente';
        li.appendChild(s);
      }
      liste.appendChild(li);
    });
    $('vide').style.display = visibles.length ? 'none' : 'block';

    const envoyees = etat.photos.filter((p) => p.jour === aujourdhui && p.statut === 'ok').length;
    $('compteur').textContent = envoyees + (envoyees > 1 ? ' photos envoyées' : ' photo envoyée');

    const enAttente = etat.photos.filter((p) => p.statut !== 'ok').length;
    const bandeau = $('attente');
    if (enAttente) {
      bandeau.textContent = enAttente + (enAttente > 1 ? ' photos pas encore dans le Drive. Elles sont gardées'
        : ' photo pas encore dans le Drive. Elle est gardée') +
        ' sur le téléphone et partira dès que le réseau revient, quand l\'appli est ouverte.';
      bandeau.classList.add('visible');
    } else {
      bandeau.classList.remove('visible');
    }
  }

  /* ---------- Démarrage ---------- */
  (async function demarrer() {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

    etat.config = lire('photoEins.config', null);
    etat.modeles = lire('photoEins.modeles', {});
    etat.debut = lire('photoEins.debut', '');

    const aujourdhui = jour();
    const stock = await Base.tout();
    for (const p of stock) {
      if (p.statut === 'ok' && p.jour !== aujourdhui) { Base.retirer(p.nom); continue; }   // ménage des jours passés
      if (!p.b64 && p.statut !== 'ok') { Base.retirer(p.nom); continue; }
      if (p.statut === 'envoi' || p.statut === 'prep') p.statut = 'attente';
      etat.photos.push(p);
      etat.nomsUtilises.add(sansExt(p.nom));
    }

    afficher();
    if (!etat.config) { ouvrirReglages(); return; }
    chargerDrive();
    pompe();
  })();
</script>
</body>
</html>
